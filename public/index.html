<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08121f" />
    <meta name="description" content="PKG Link — a local package library and PS4 Remote Package Installer dashboard." />
    <title>PKG Link · PS4 package library</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div id="app" class="app-frame">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="brand-copy"><strong>PKG</strong><span>LINK</span></div>
        </div>

        <div class="sidebar-label">Workspace</div>
        <nav class="nav-list">
          <button class="nav-item is-active" data-view="library" type="button">
            <span class="nav-icon" data-icon="library"></span><span class="nav-text">Library</span><span class="nav-count" id="library-count">0</span>
          </button>
          <button class="nav-item" data-view="transfers" type="button">
            <span class="nav-icon" data-icon="activity"></span><span class="nav-text">Transfers</span><span class="nav-count" id="transfer-count">0</span>
          </button>
          <button class="nav-item" data-view="settings" type="button">
            <span class="nav-icon" data-icon="settings"></span><span class="nav-text">Settings</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-status">
          <div class="status-orb"><span></span></div>
          <div class="sidebar-status-copy"><strong id="sidebar-status-title">Waiting for PS4</strong><span id="sidebar-status-detail">Configure a connection</span></div>
          <button class="icon-button tiny" data-view="settings" type="button" aria-label="Open settings" title="Open settings"><span data-icon="chevron"></span></button>
        </div>
        <div class="sidebar-footer"><span class="pulse-dot"></span><span>Local workspace</span><span class="version-label">v1.0</span></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="mobile-brand">
            <div class="brand-mark small" aria-hidden="true"><span></span><span></span><span></span></div><strong>PKG<span>LINK</span></strong>
          </div>
          <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="page-title">Library</strong></div>
          <div class="topbar-actions">
            <div id="server-pill" class="server-pill is-muted"><span class="server-pulse"></span><span id="server-pill-text">Starting library…</span></div>
            <button id="refresh-button" class="icon-button" type="button" title="Refresh library" aria-label="Refresh library"><span data-icon="refresh"></span></button>
            <button class="avatar-button" data-view="settings" type="button" aria-label="Open settings" title="Settings"><span>PL</span></button>
          </div>
        </header>

        <div id="toast-region" class="toast-region" aria-live="polite"></div>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
